    <!-- Error suppression for sandboxed third-party tracker scripts (Clarity, Disqus) -->
    <script type="text/javascript">
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        var str = String(msg || '');
        var u = String(url || '');
        if (
          str === 'Script error.' ||
          str.indexOf('Script error') !== -1 ||
          !u ||
          u.indexOf('disqus') !== -1 ||
          u.indexOf('clarity') !== -1
        ) {
          return true;
        }
        return false;
      };
      window.addEventListener('unhandledrejection', function(e) {
        var reason = (e && e.reason && e.reason.message) || String(e.reason || '');
        if (
          reason.indexOf('disqus') !== -1 ||
          reason.indexOf('clarity') !== -1 ||
          reason.indexOf('Script error') !== -1
        ) {
          e.preventDefault();
        }
      });
    </script>
